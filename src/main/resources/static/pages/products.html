<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos | Loja Nos Postumos</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pages/products.css">
</head>
<body>
    <header class="site-header">
        <a class="site-logo" href="../index.html">
            <img class="site-logo-image" src="../assets/images/Logo_Nos_Postumos_Horizontal.png" alt="Logo Nos Postumos">
            <span class="site-logo-credit">By Gabriela F. Fernandes</span>
        </a>
        <nav class="main-navigation" aria-label="Navegação principal">
            <a href="../index.html">Início</a>
            <a href="products.html" aria-current="page">Produtos</a>
            <a href="../index.html#sobre">Sobre a marca</a>
            <a href="cart.html">Carrinho</a>
            <a href="login.html">Entrar</a>
        </nav>
    </header>

    <main>
        <h1>Produtos</h1>
        <section class="product-grid" aria-label="Lista de produtos"></section>
    </main>

    <div class="modal-backdrop" data-measurements-modal hidden>
        <section
            class="measurements-modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="measurements-modal-title"
            tabindex="-1"
        >
            <div class="measurements-modal-header">
                <h2 id="measurements-modal-title">Medidas do produto</h2>
                <button class="modal-close-button" type="button" aria-label="Fechar medidas">&times;</button>
            </div>
            <p class="measurements-modal-description">Confira as medidas disponíveis para cada tamanho.</p>
            <div class="measurements-table-wrapper">
                <table class="measurements-table">
                    <thead>
                        <tr>
                            <th scope="col">Medida</th>
                            <th scope="col">P</th>
                            <th scope="col">M</th>
                            <th scope="col">G</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <script src="../js/pages/products.js"></script>
</body>
</html>
